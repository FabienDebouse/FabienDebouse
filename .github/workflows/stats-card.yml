name: Update stats card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/stats-card.mjs"
      - ".github/workflows/stats-card.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate card
        env:
          # A PAT stored as STATS_TOKEN sees more data; the default token already
          # sees private contribution counts when they are shown on the profile.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: node .github/scripts/stats-card.mjs "${{ github.repository_owner }}" assets/github-stats.svg
      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --cached --quiet || (git commit -m "Update stats card" && git push)
