name: Update languages card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Needs a PAT with read access to private repos; the default token only sees public ones.
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - name: Skip without STATS_TOKEN
        if: env.STATS_TOKEN == ''
        run: echo "::notice::STATS_TOKEN secret not set, languages card left unchanged."
      - uses: actions/checkout@v4
        if: env.STATS_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.STATS_TOKEN != ''
        with:
          node-version: 20
      - name: Generate card
        if: env.STATS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node .github/scripts/top-langs-card.mjs "${{ github.repository_owner }}" assets/top-langs.svg
      - name: Commit card
        if: env.STATS_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          git diff --cached --quiet || (git commit -m "Update languages card" && git push)
